<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aegis — Secure Credential Vault</title>
    <!-- Fonts are bundled locally (src/assets/fonts, OFL). No external font services. -->
    <script>
      // Prevent theme flicker: apply theme before first paint
      (function() {
        try {
          var stored = localStorage.getItem('aegis-theme');
          var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch(e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
      #app { height: 100%; }
      /* Pre-paint backgrounds matching the tokenized --surface-base per theme,
         so the first frame is already on-identity (no white/black flash). */
      [data-theme="dark"] { background: #050a18; }
      [data-theme="light"] { background: #eef4fc; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
